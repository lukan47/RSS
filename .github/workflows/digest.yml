name: Daily Cybersecurity Digest

on:
  schedule:
    - cron: "0 22 * * *"  # 06:00 UTC+8 (PH time) daily
  workflow_dispatch:        # allow manual runs

jobs:
  run-digest:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python daily_cybersecurity_digest.py
