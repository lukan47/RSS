<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>All Articles — CI Overwatch</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d0e17; color: #e0e0e0; }
  a { color: inherit; }

            display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }

  .back:hover, .back:focus-visible { border-color: #DA291C; outline: none; }

             background: #10111b; border-bottom: 1px solid #1a1d27; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: .7rem; color: #8a8fa3;
           text-transform: uppercase; letter-spacing: .06em; }
  select, input[type="date"], input[type="search"] {
    background: #1e2030; color: #e0e0e0; border: 1px solid #2a2d3e; border-radius: 4px;
    padding: 6px 10px; font-size: .8rem; font-family: inherit; min-width: 140px; }
  input[type="search"] { min-width: 220px; }
  select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid #DA291C; outline-offset: 1px; }
  .spacer { flex: 1 1 auto; }
  .export { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: #c9cbd6; cursor: pointer; }
  .btn { background: #DA291C; color: #fff; border: none; border-radius: 4px; padding: 7px 14px; font-size: .78rem;
         font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: #f0352a; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: #1e2030; border: 1px solid #2a2d3e; }

  #status.error { color: #ff7b72; }

  .day { font-size: .78rem; font-weight: 700; color: #fff; padding: 18px 0 8px; border-bottom: 1px solid #1a1d27;
         margin-bottom: 10px; letter-spacing: .02em; }
  .day small { color: #6b7088; font-weight: 400; margin-left: 8px; }
  .item { background: #1a1d27; border-radius: 7px; padding: 12px 14px; margin-bottom: 8px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .72rem; color: #8a8fa3; margin-bottom: 6px; }
  .chip { color: #fff; border-radius: 3px; padding: 1px 7px; font-weight: 600; font-size: .68rem; }
  .src { color: #ff5a4d; font-weight: 600; }
  .title { display: block; color: #d8d8d8; text-decoration: none; font-size: .9rem; line-height: 1.5; }
  .title:hover, .title:focus-visible { color: #fff; text-decoration: underline; outline: none; }
  .meta .card-details { margin-left: auto; }

  .bl-group:hover, .bl-group:focus-visible { color: #fff; text-decoration: underline; outline: none; }

  .rm-head h2 { font-size: .92rem; color: #fff; }
  .rm-head small { color: #6b7088; font-size: .72rem; }
  .tl { list-style: none; padding: 6px 16px 10px 28px; margin: 0; position: relative; }
  .tl::before { content: ""; position: absolute; left: 20px; top: 14px; bottom: 16px; width: 2px; background: #2a2d3e; }
  .tl li { position: relative; padding: 7px 0 7px 14px; display: grid; grid-template-columns: 78px auto 1fr; gap: 4px 12px; align-items: baseline; }
  .tl li::before { content: ""; position: absolute; left: -12px; top: 15px; width: 8px; height: 8px; border-radius: 50%; background: #4b5068; }

  .tl .kind.k-retirement { background: #DA291C; color: #fff; }
  .tl .kind.k-launch, .tl .kind.k-general-availability { background: #2e7d4f; color: #fff; }
  .tl .kind.k-preview-roadmap { background: #8e6bd6; color: #fff; }
  .tl .kind.k-integration { background: #3b6fb5; color: #fff; }
  .tl a { color: #d8d8d8; text-decoration: none; font-size: .86rem; line-height: 1.45; }
  .tl a:hover, .tl a:focus-visible { color: #fff; text-decoration: underline; outline: none; }
  .tl small { grid-column: 3; color: #6b7088; font-size: .7rem; margin-top: -2px; }

  .btn.small { padding: 5px 12px; font-size: .72rem; }
  .lead-link { font-size: .74rem; color: #8a8fa3; text-decoration: none; }

<body>

<div class="topbar">
  <div>
    <h1><span>CI</span> Overwatch &mdash; All Articles</h1>
    <p id="summary">Loading articles&hellip;</p>
  </div>
  <div class="links">
    <a class="back" href="sources.html" title="Which feeds work, which are failing or stale">Source health</a>
    <a class="back" href="../../">&larr; Dashboard</a>
  </div>
</div>

<form class="filters" id="filters" onsubmit="return false">
  <label class="field">Period
    <select id="period">
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="all" selected>All time</option>
      <option value="custom">Custom range&hellip;</option>
    </select>
  </label>
  <label class="field" id="from-wrap" hidden>From <input type="date" id="from"></label>
  <label class="field" id="to-wrap" hidden>To <input type="date" id="to"></label>
  <label class="field">Category <select id="category"></select></label>
  <label class="field">Vendor <select id="vendor"></select></label>
  <label class="field">Module <select id="module"></select></label>
  <label class="field">Type
    <select id="type">
      <option value="">All types</option>
      <option value="podcast">Podcasts</option>
      <option value="article">Articles</option>
    </select>
  </label>
  <label class="field">Source <select id="source"></select></label>
  <label class="field">Search <input type="search" id="q" placeholder="Title, source or summary"></label>
  <label class="chk" id="watch-wrap" hidden title="Only articles that match watchlist.json"><input type="checkbox" id="watch"> &#9733; Watchlist only</label>
  <div class="spacer"></div>
  <div class="export">
    <button type="button" class="btn ghost" id="btn-brief-md" disabled title="Last 7 days: top stories, spikes, vulnerabilities, deals, product news, policy, watchlist">&darr; Briefing .md</button>
    <button type="button" class="btn ghost" id="btn-brief-doc" disabled title="Same briefing as a Word document">&darr; Briefing .doc</button>
    <label class="chk"><input type="checkbox" id="fulltext"> Include full article text</label>
    <button type="button" class="btn" id="btn-json" disabled>&darr; JSON</button>
    <button type="button" class="btn" id="btn-csv" disabled>&darr; CSV</button>
  </div>
</form>

<div class="viewbar">
  <div class="seg" role="group" aria-label="View">
    <button type="button" id="view-articles" aria-pressed="true">Articles</button>
    <button type="button" id="view-topics" aria-pressed="false">Topics</button>
    <button type="button" id="view-baseline" aria-pressed="false">Baseline</button>
    <button type="button" id="view-roadmap" aria-pressed="false">Roadmap</button>
  </div>
  <span id="roadmap-options" hidden>
    <label class="field">Kind
      <select id="rm-kind">
        <option value="">All</option>
        <option value="Launch">Launch</option>
        <option value="Preview / roadmap">Preview / roadmap</option>
        <option value="General availability">General availability</option>
        <option value="Integration">Integration</option>
        <option value="Retirement">Retirement</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="rm-untracked"> Include untracked vendors</label>
  </span>
  <span id="baseline-options" hidden>
    <label class="field">Group by
      <select id="bl-by">
        <option value="category">Category</option>
        <option value="vendor">Vendor</option>
        <option value="module">Module</option>
      </select>
    </label>
    <label class="field">Window
      <select id="bl-window">
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30">Last 30 days</option>
      </select>
    </label>
    <label class="field">Compared with
      <select id="bl-weeks">
        <option value="4">Previous 4 weeks</option>
        <option value="8" selected>Previous 8 weeks</option>
        <option value="12">Previous 12 weeks</option>
      </select>
    </label>
    <label class="field">Sort
      <select id="bl-sort">
        <option value="increase">Biggest increase</option>
        <option value="drop">Biggest drop</option>
        <option value="volume">Most articles</option>
        <option value="name">Name</option>
      </select>
    </label>
  </span>
  <span id="topic-options" hidden>
    <label class="field">Sort
      <select id="topic-sort">
        <option value="coverage">Most covered</option>
        <option value="newest">Newest</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="topic-multi" checked> Only topics with 2+ articles</label>
  </span>
  <span class="saved">
    <label class="field">Saved views
      <select id="saved-views"><option value="">Choose&hellip;</option></select>
    </label>
    <button type="button" class="btn ghost small" id="view-save" title="Remember the current filters and view in this browser">Save view</button>
    <button type="button" class="btn ghost small" id="view-delete" disabled>Delete</button>
    <button type="button" class="btn ghost small" id="view-link" title="Copy a link that opens exactly this view">Copy link</button>
  </span>
</div>
<div id="status" role="status" aria-live="polite"></div>
<main id="list"></main>
<button type="button" class="btn ghost" id="more" hidden>Show more</button>

    meta.appendChild(t);
    var details = document.createElement('button'); details.type = 'button'; details.className = 'card-details';
    details.setAttribute('aria-label', 'Details and export'); details.__article = a;
    meta.appendChild(details);
    var link = document.createElement('a'); link.className = 'title'; link.href = a.link; link.target = '_blank';
    link.rel = 'noopener noreferrer'; link.textContent = a.title;
    el.appendChild(meta); el.appendChild(link);
    var shown = (a.modules || []).filter(function (m) { return m !== 'Other/General' && m !== 'N/A'; });
    if (shown.length) { var mp = document.createElement('div'); mp.className = 'mods'; mp.textContent = shown.join(' · '); el.appendChild(mp); }
    if (a.context) { var p = document.createElement('p'); p.className = 'ctx'; p.textContent = a.context; el.appendChild(p); }
    return el;
  }

  // Every option list is alphabetical, with "No Specific Vendor" first. `listed` names are always offered, even with no articles (count 0).
  function fillSelect(id, label, counts, listed) {
    var sel = $(id);
    (listed || []).forEach(function (k) { if (counts[k] === undefined) counts[k] = 0; });
    var keys = Object.keys(counts);
    keys.sort(function (x, y) {
      if (x === NO_VENDOR) return -1;
      if (y === NO_VENDOR) return 1;
      return x.localeCompare(y, undefined, { sensitivity: 'base' });
    });
    var first = document.createElement('option'); first.value = ''; first.textContent = 'All ' + label;
    sel.appendChild(first);
    keys.forEach(function (k) {
      var o = document.createElement('option'); o.value = k; o.textContent = k + ' (' + counts[k] + ')'; sel.appendChild(o);
    });
  }

  function csvCell(v) {
    v = v == null ? '' : String(v);
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function download(name, mime, content) {
    var url = URL.createObjectURL(new Blob([content], { type: mime }));
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  async function loadTexts() {
    var want = {}, months = {}, texts = {}, failed = [];
    rows.forEach(function (a) { want[a.id] = 1; months[a.date ? a.date.slice(0, 7) : 'undated'] = 1; });
    var list = Object.keys(months);
    for (var i = 0; i < list.length; i++) {
      setStatus('Loading full text ' + (i + 1) + ' of ' + list.length + ' (' + list[i] + ')…');
      try {
        var res = await fetch('fulltext/' + list[i] + '.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var shard = await res.json();
        Object.keys(shard).forEach(function (k) { if (want[k]) texts[k] = shard[k].text || ''; });
      } catch (e) { failed.push(list[i]); }
    }
    return { texts: texts, failed: failed };
  }

  function exportBaseline(fmt) {
    var m = baselineMeta, base = 'baseline_' + m.by + '_last' + m.W + 'd_vs_' + m.N + 'w_' + m.anchor;
    var weekHead = baselineRows.length ? baselineRows[0].weekly.map(function (_, i, a) { return i === a.length - 1 ? 'This week' : 'Week -' + (a.length - 1 - i); }) : [];
    var recs = baselineRows.map(function (r) {
      return { group: r.group, current: r.current, baseline_expected: Math.round(r.expected * 100) / 100,
               change_pct: r.delta === null ? null : Math.round(r.delta * 1000) / 10, z_score: Math.round(r.z * 100) / 100, status: r.status, weekly: r.weekly };
    });
    if (fmt === 'json') {
      download(base + '.json', 'application/json', JSON.stringify({ exported: new Date().toISOString(), as_of: m.anchor, group_by: m.by,
        window: { days: m.W, from: m.from, to: m.anchor }, baseline: { days: m.baseDays, from: m.baseFrom, to: m.baseTo },
        filters: { category: $('category').value, vendor: $('vendor').value, module: $('module').value, source: $('source').value, type: $('type').value, search: $('q').value },
        rows: recs }, null, 2));
    } else {
      var lines = [['Group', 'Last ' + m.W + ' days', 'Baseline (expected)', 'Change %', 'Z score', 'Status'].concat(weekHead).join(',')];
      recs.forEach(function (x) {
        lines.push([x.group, x.current, x.baseline_expected, x.change_pct === null ? 'new' : x.change_pct, x.z_score, x.status].concat(x.weekly).map(csvCell).join(','));
      });
      download(base + '.csv', 'text/csv;charset=utf-8', '﻿' + lines.join('\r\n'));
    }
    setStatus('Exported ' + recs.length + ' baseline rows as ' + fmt.toUpperCase() + '.');
  }

  async function doExport(fmt) {
    if (view === 'baseline') { exportBaseline(fmt); return; }
    if (view === 'roadmap') { exportRoadmap(fmt); return; }
    var withText = $('fulltext').checked, texts = {}, failed = [];
    $('btn-json').disabled = $('btn-csv').disabled = true;
    try {
      if (withText) { var r = await loadTexts(); texts = r.texts; failed = r.failed; }
      var recs = rows.map(function (a) {
        var rec = { id: a.id, story: a.story || a.id, date: a.date, category: a.category, vendor: a.vendor || '', modules: a.modules || [], podcast: !!a.podcast, source: a.source, title: a.title, link: a.link, context: a.context || '' };
        if (withText) rec.full_text = texts[a.id] || '';
        return rec;
      });
      var rg = range(), cat = $('category').value, vend = $('vendor').value, mod = $('module').value;
      var base = 'articles_' + (cat || 'all-categories') + (vend ? '_' + vend : '') + (mod ? '_' + mod : '') + '_' + (rg.from || 'start') + '_to_' + (rg.to || 'now');
      base = base.replace(/[^A-Za-z0-9_-]+/g, '_');
      if (fmt === 'json') {
        download(base + '.json', 'application/json', JSON.stringify({
          exported: new Date().toISOString(),
          filters: { period: $('period').value, from: rg.from, to: rg.to, category: cat, vendor: vend, module: mod, source: $('source').value, search: $('q').value },
          count: recs.length, articles: recs }, null, 2));
      } else {
        var head = ['ID', 'Story', 'Date', 'Category', 'Vendor', 'Modules', 'Type', 'Source', 'Title', 'Link', 'Context'].concat(withText ? ['Full Text'] : []);
        var lines = [head.join(',')];
        recs.forEach(function (x) {
          var cells = [x.id, x.story, x.date ? x.date.slice(0, 16).replace('T', ' ') + ' UTC' : '', x.category, x.vendor, x.modules.join('; '), x.podcast ? 'Podcast' : 'Article', x.source, x.title, x.link, x.context];
          if (withText) {
            var t = x.full_text;
            cells.push(t.length > CSV_CELL_LIMIT ? t.slice(0, CSV_CELL_LIMIT) + ' [truncated for CSV - use JSON for the full text]' : t);
          }
          lines.push(cells.map(csvCell).join(','));
        });
        download(base + '.csv', 'text/csv;charset=utf-8', '﻿' + lines.join('\r\n'));
      }
      var missing = withText ? recs.filter(function (x) { return !x.full_text; }).length : 0;
      setStatus('Exported ' + recs.length.toLocaleString() + ' articles' +
        (withText ? (missing ? ' (' + missing + ' without saved text)' : ' with full text') : '') +
        (failed.length ? '. Could not load text for: ' + failed.join(', ') : '') + '.', failed.length > 0);
    } catch (e) {
      setStatus('Export failed: ' + e.message, true);
    } finally {
      $('btn-json').disabled = $('btn-csv').disabled = rows.length === 0;
    }
  }

  function init(data) {
    all = data.articles;
    all.forEach(function (a) { var k = a.story || a.id; (byStory[k] = byStory[k] || []).push(a); });
    var cats = {}, vends = {}, srcs = {}, mods = {};
    all.forEach(function (a) {
      cats[a.category] = (cats[a.category] || 0) + 1;
      var vk = a.vendor || NO_VENDOR; vends[vk] = (vends[vk] || 0) + 1;
      srcs[a.source] = (srcs[a.source] || 0) + 1;
      (a.modules || []).forEach(function (m) { mods[m] = (mods[m] || 0) + 1; });
    });
    fillSelect('category', 'categories', cats, CATEGORY_NAMES);
    fillSelect('vendor', 'vendors', vends, VENDOR_NAMES);
    fillSelect('module', 'modules', mods, false);
    fillSelect('source', 'sources', srcs, false);
    $('to').max = $('from').max = isoDay(0);
    var timer;
    ['category', 'vendor', 'module', 'type', 'source', 'from', 'to'].forEach(function (id) { $(id).addEventListener('change', applyFilters); });
    $('period').addEventListener('change', function () {
      var custom = $('period').value === 'custom';
      $('from-wrap').hidden = $('to-wrap').hidden = !custom;
      applyFilters();
    });
    $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(applyFilters, 150); });
    $('more').addEventListener('click', renderMore);
    function openArticle(a) {
      window.ArticleModal.open({ id: a.id, shareUrl: location.origin + location.pathname + '#' + a.id,
        title: a.title, link: a.link, source: a.source, date: a.date, category: a.category,
        color: COLORS[a.category] || '', vendor: a.vendor || '', vendorColor: COLORS[a.vendor] || '', modules: a.modules || [], podcast: !!a.podcast, transcript: !!a.transcript,
        context: a.context || '' }, { fullTextBase: 'fulltext/' });
    }
    function openFromHash() {
      var id = location.hash.replace('#', '');
      if (!/^[0-9a-f]{12}$/.test(id)) return;
      var hit = all.filter(function (a) { return a.id === id; })[0];
      if (hit) openArticle(hit); else setStatus('No article with ID ' + id + ' was found.', true);
    }
    $('list').addEventListener('click', function (e) {
      var btn = e.target.closest('.card-details');
      if (btn && btn.__article) { openArticle(btn.__article); return; }
      var open = e.target.closest('.topic-open');
      if (open && open.__topic) {
        var t = open.__topic;
        window.StoryModal.open({ title: t.lead.title, members: t.total.map(toArticle) }, { fullTextBase: 'fulltext/' });
      }
    });
    function setView(next) {
      view = next;
      ['articles', 'topics', 'baseline', 'roadmap'].forEach(function (v) { $('view-' + v).setAttribute('aria-pressed', next === v ? 'true' : 'false'); });
      $('topic-options').hidden = next !== 'topics';
      $('baseline-options').hidden = next !== 'baseline';
      $('roadmap-options').hidden = next !== 'roadmap';
      $('period').disabled = next === 'baseline';
      $('category').disabled = next === 'roadmap';
      applyFilters();
    }
    $('view-articles').addEventListener('click', function () { setView('articles'); });
    $('view-topics').addEventListener('click', function () { setView('topics'); });
    $('view-baseline').addEventListener('click', function () { setView('baseline'); });
    ['bl-by', 'bl-window', 'bl-weeks', 'bl-sort'].forEach(function (id) { $(id).addEventListener('change', applyFilters); });
    // Clicking a group in the baseline table shows its articles for the same window
    function showGroup(group) {
      var by = baselineMeta.by;
      var target = by === 'category' ? 'category' : by === 'vendor' ? 'vendor' : 'module';
      $('category').value = $('vendor').value = $('module').value = '';
      $(target).value = group;
      $('period').disabled = false;
      $('period').value = 'custom'; $('from-wrap').hidden = $('to-wrap').hidden = false;
      $('from').value = baselineMeta.from; $('to').value = '';
      setView('articles');
    }
    $('list').addEventListener('click', function (e) {
      var g = e.target.closest('.bl-group');
      if (g && g.__group) showGroup(g.__group);
    });
    $('topic-sort').addEventListener('change', applyFilters);
    $('topic-multi').addEventListener('change', applyFilters);
    $('btn-json').addEventListener('click', function () { doExport('json'); });
    $('btn-csv').addEventListener('click', function () { doExport('csv'); });
    $('view-roadmap').addEventListener('click', function () { setView('roadmap'); });
    ['rm-kind', 'rm-untracked', 'watch'].forEach(function (id) { $(id).addEventListener('change', applyFilters); });
    $('btn-brief-md').disabled = $('btn-brief-doc').disabled = false;
    $('btn-brief-md').addEventListener('click', function () { exportBriefing('md'); });
    $('btn-brief-doc').addEventListener('click', function () { exportBriefing('doc'); });

    // Shareable and saved views: the view and its filters as URL parameters
    var FIELDS = { period: 'period', from: 'from', to: 'to', category: 'category', vendor: 'vendor', module: 'module', type: 'type', source: 'source', q: 'q',
                   by: 'bl-by', win: 'bl-window', weeks: 'bl-weeks', sort: 'bl-sort', kind: 'rm-kind' };
    var defaults = {};
    Object.keys(FIELDS).forEach(function (k) { defaults[k] = $(FIELDS[k]).value; });
    function viewParams() {
      var p = new URLSearchParams(); p.set('view', view);
      Object.keys(FIELDS).forEach(function (k) { var v = $(FIELDS[k]).value; if (v && v !== defaults[k]) p.set(k, v); });
      if ($('watch').checked) p.set('watch', '1');
      if ($('rm-untracked').checked) p.set('untracked', '1');
      return p;
    }
    function applyParams(p) {
      Object.keys(FIELDS).forEach(function (k) {
        var el = $(FIELDS[k]), v = p.has(k) ? p.get(k) : defaults[k];
        if (el.tagName === 'SELECT') el.value = Array.prototype.some.call(el.options, function (o) { return o.value === v; }) ? v : defaults[k];
        else el.value = v;
      });
      $('watch').checked = p.get('watch') === '1';
      $('rm-untracked').checked = p.get('untracked') === '1';
      var custom = $('period').value === 'custom'; $('from-wrap').hidden = $('to-wrap').hidden = !custom;
      var v = p.get('view');
      setView(['articles', 'topics', 'baseline', 'roadmap'].indexOf(v) !== -1 ? v : 'articles');
    }
    var SAVED_KEY = 'ciSavedViews';
    function loadSaved() { try { return JSON.parse(localStorage.getItem(SAVED_KEY) || '{}') || {}; } catch (e) { return {}; } }
    function storeSaved(o) { try { localStorage.setItem(SAVED_KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
    function paintSaved(select) {
      var o = loadSaved(), sel = $('saved-views'); sel.textContent = '';
      var first = document.createElement('option'); first.value = ''; first.textContent = 'Choose…'; sel.appendChild(first);
      Object.keys(o).sort().forEach(function (n) { var op = document.createElement('option'); op.value = n; op.textContent = n; sel.appendChild(op); });
      if (select && o[select]) sel.value = select;
      $('view-delete').disabled = !sel.value;
    }
    $('saved-views').addEventListener('change', function () {
      var o = loadSaved(), n = $('saved-views').value;
      $('view-delete').disabled = !n;
      if (n && o[n]) applyParams(new URLSearchParams(o[n]));
    });
    $('view-save').addEventListener('click', function () {
      var name = (window.prompt('Name this view:') || '').trim();
      if (!name) return;
      var o = loadSaved(); o[name] = viewParams().toString();
      if (storeSaved(o)) { paintSaved(name); setStatus('Saved view "' + name + '" (kept in this browser).'); }
      else setStatus('This browser would not save the view. Use Copy link instead.', true);
    });
    $('view-delete').addEventListener('click', function () {
      var n = $('saved-views').value, o = loadSaved();
      if (!n) return;
      delete o[n]; storeSaved(o); paintSaved(''); setStatus('Deleted view "' + n + '".');
    });
    $('view-link').addEventListener('click', async function () {
      var link = location.origin + location.pathname + '#' + viewParams().toString();
      try { await navigator.clipboard.writeText(link); setStatus('Link to this view copied.'); }
      catch (e) { setStatus('Could not copy automatically. Link: ' + link, true); }
    });
    function applyHash() {
      var h = location.hash.replace(/^#/, '');
      if (h.indexOf('=') === -1) return false;
      applyParams(new URLSearchParams(h));
      return true;
    }
    window.addEventListener('hashchange', function () { if (!applyHash()) openFromHash(); });
    paintSaved('');

    // The watchlist is optional; the page works without it. The first view is drawn once it has loaded (or failed to).
    fetch('../../watchlist.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (w) {
        if (w) watchlist = { vendors: (w.vendors || []).map(String), keywords: (w.keywords || []).map(function (k) { return String(k).toLowerCase(); }) };
      })
      .catch(function () {})
      .then(function () {
        $('watch-wrap').hidden = !watchActive();
        if (!applyHash()) applyFilters();
        openFromHash();
      });
  }

  fetch('articles.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(init)
    .catch(function (e) {
      $('summary').textContent = 'Could not load articles';
      setStatus('Could not load articles.json (' + e.message + '). Open this page from the published site, not from a file.', true);
    });
})();
</script>
</body>
</html>
