  .export { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: #c9cbd6; cursor: pointer; }
  .btn { background: #DA291C; color: #fff; border: none; border-radius: 4px; padding: 7px 14px; font-size: .78rem;
         font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: #f0352a; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: #1e2030; border: 1px solid #2a2d3e; }

  .chip { color: #fff; border-radius: 3px; padding: 1px 7px; font-weight: 600; font-size: .68rem; }

<div class="topbar">
  <div>
    <h1><span>CI</span> Overwatch &mdash; All Articles</h1>

</div>

      <option value="30">Last 30 days</option>

      <option value="custom">Custom range&hellip;</option>

  <label class="field" id="from-wrap" hidden>From <input type="date" id="from"></label>
  <label class="field" id="to-wrap" hidden>To <input type="date" id="to"></label>
  <label class="field">Category <select id="category"></select></label>
  <label class="field">Vendor <select id="vendor"></select></label>
  <label class="field">Module <select id="module"></select></label>
  <label class="field">Type

      <option value="podcast">Podcasts</option>
      <option value="article">Articles</option>
    </select>

  <label class="field">Source <select id="source"></select></label>
  <label class="field">Search <input type="search" id="q" placeholder="Title, source or summary"></label>
  <div class="spacer"></div>
  <div class="export">
    <label class="chk"><input type="checkbox" id="fulltext"> Include full article text</label>
    <button type="button" class="btn" id="btn-json" disabled>&darr; JSON</button>
    <button type="button" class="btn" id="btn-csv" disabled>&darr; CSV</button>
  </div>
</form>

<div class="viewbar">
  <div class="seg" role="group" aria-label="View">
    <button type="button" id="view-articles" aria-pressed="true">Articles</button>

    <button type="button" id="view-baseline" aria-pressed="false">Baseline</button>

    <label class="field">Group by

        <option value="category">Category</option>
        <option value="vendor">Vendor</option>
        <option value="module">Module</option>
      </select>
    </label>
    <label class="field">Window
      <select id="bl-window">
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30">Last 30 days</option>
      </select>
    </label>
    <label class="field">Compared with

        <option value="4">Previous 4 weeks</option>
        <option value="8" selected>Previous 8 weeks</option>
        <option value="12">Previous 12 weeks</option>
      </select>
    </label>
    <label class="field">Sort

        <option value="increase">Biggest increase</option>
        <option value="drop">Biggest drop</option>
        <option value="volume">Most articles</option>
        <option value="name">Name</option>
      </select>
    </label>
  </span>
  <span id="topic-options" hidden>
    <label class="field">Sort
      <select id="topic-sort">
        <option value="coverage">Most covered</option>
        <option value="newest">Newest</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="topic-multi" checked> Only topics with 2+ articles</label>
  </span>
</div>
<div id="status" role="status" aria-live="polite"></div>
<main id="list"></main>
<button type="button" class="btn ghost" id="more" hidden>Show more</button>

    res.rows.forEach(function (r) {
      var tr = document.createElement('tr'), td = document.createElement('td');
      var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'bl-group'; btn.textContent = r.group; btn.__group = r.group;
      btn.title = 'Show these articles'; if (COLORS[r.group]) btn.style.borderLeftColor = COLORS[r.group];
      td.appendChild(btn); tr.appendChild(td);
      function cell(text, cls) { var c = document.createElement('td'); c.textContent = text; if (cls) c.className = cls; tr.appendChild(c); return c; }
      cell(String(r.current), 'num');
      cell(r.expected.toFixed(r.expected < 10 ? 1 : 0), 'num');
      cell(r.delta === null ? 'new' : (r.delta >= 0 ? '+' : '') + Math.round(r.delta * 100) + '%', 'num ' + (r.delta === null || r.delta > 0 ? 'up' : r.delta < 0 ? 'down' : ''));
      var sp = document.createElement('td'); sp.innerHTML = sparkSvg(r.weekly); tr.appendChild(sp);
      var st = document.createElement('td'), chip = document.createElement('span'); chip.className = 'bl-chip bl-' + r.status.toLowerCase().replace('/', ''); chip.textContent = r.status; st.appendChild(chip); tr.appendChild(st);
      body.appendChild(tr);
    });
    table.appendChild(body); host.appendChild(table);
  }

  function toArticle(a) {
    return { id: a.id, story: a.story || a.id, shareUrl: location.origin + location.pathname + '#' + a.id, title: a.title, link: a.link,
      source: a.source, date: a.date, category: a.category, color: COLORS[a.category] || '', vendor: a.vendor || '', vendorColor: COLORS[a.vendor] || '',
      modules: a.modules || [], podcast: !!a.podcast, transcript: !!a.transcript, context: a.context || '' };
  }

  function addChips(meta, a) {
    var chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = a.category || 'Uncategorised';
    chip.style.background = COLORS[a.category] || '#555a70';
    meta.appendChild(chip);
    if (a.vendor) {
      var v = document.createElement('span'); v.className = 'chip'; v.textContent = a.vendor;
      v.style.background = COLORS[a.vendor] || '#555a70';
      meta.appendChild(v);
    }
  }

  function buildTopicItem(t) {
    var a = t.lead, el = document.createElement('article'); el.className = 'item topic';
    var meta = document.createElement('div'); meta.className = 'meta';
    var cnt = document.createElement('span'); cnt.className = 'src';
    cnt.textContent = t.sources.length + ' source' + (t.sources.length === 1 ? '' : 's') + ' · ' + t.total.length + ' article' + (t.total.length === 1 ? '' : 's');
    var when = document.createElement('time'); when.textContent = t.latest ? 'latest ' + t.latest.slice(0, 10) : '';
    addChips(meta, a); meta.appendChild(cnt); meta.appendChild(when);
    if (t.matched.some(function (m) { return /actively exploited|exploited in the wild|zero-?day|known exploited/i.test(m.title + ' ' + (m.context || '')); })) {
      var hot = document.createElement('span'); hot.className = 'hot'; hot.textContent = 'Exploited'; meta.appendChild(hot);
    }
    var title = document.createElement('a'); title.className = 'title'; title.href = a.link; title.target = '_blank';
    title.rel = 'noopener noreferrer'; title.textContent = a.title;
    el.appendChild(meta); el.appendChild(title);
    var counts = {};
    t.matched.forEach(function (m) { (m.modules || []).forEach(function (x) { if (x !== 'Other/General' && x !== 'N/A') counts[x] = (counts[x] || 0) + 1; }); });
    var mods = Object.keys(counts).sort(function (x, y) { return counts[y] - counts[x]; }).slice(0, 3);
    if (mods.length) { var mp = document.createElement('div'); mp.className = 'mods'; mp.textContent = mods.join(' · '); el.appendChild(mp); }
    var shownSources = t.sources.slice(0, 6), more = t.sources.length - shownSources.length;
    var sp = document.createElement('p'); sp.className = 'ctx';
    sp.textContent = 'Covered by ' + shownSources.join(' · ') + (more > 0 ? ' +' + more + ' more' : '');
    el.appendChild(sp);
    var actions = document.createElement('div'); actions.className = 'topic-actions';
    var open = document.createElement('button'); open.type = 'button'; open.className = 'btn ghost small topic-open';
    open.textContent = 'View all ' + t.total.length + ' articles' + (t.matched.length < t.total.length ? ' (' + t.matched.length + ' match your filters)' : '');
    open.__topic = t;
    var lead = document.createElement('a'); lead.className = 'lead-link'; lead.href = a.link; lead.target = '_blank';
    lead.rel = 'noopener noreferrer'; lead.textContent = 'Read first article ↗';
    actions.appendChild(open); actions.appendChild(lead); el.appendChild(actions);
    return el;
  }

  function renderMore() {
    var list = $('list'), topicsView = view === 'topics', items = topicsView ? topics : rows, end = Math.min(shown + PAGE, items.length);
    for (; shown < end; shown++) {
      if (topicsView) { list.appendChild(buildTopicItem(items[shown])); continue; }
      var a = items[shown], day = a.date ? a.date.slice(0, 10) : 'undated';
      if (day !== lastDay) {
        var h = document.createElement('h2'); h.className = 'day'; h.textContent = dayLabel(day);
        var n = document.createElement('small'); n.textContent = dayCounts[day] + ' article' + (dayCounts[day] === 1 ? '' : 's');
        h.appendChild(n); list.appendChild(h); lastDay = day;
      }
      list.appendChild(buildItem(a));
    }
    $('more').hidden = shown >= items.length;
    $('more').textContent = 'Show more (' + (items.length - shown).toLocaleString() + ' remaining)';
  }

  function buildItem(a) {
    var el = document.createElement('article'); el.className = 'item';
    var meta = document.createElement('div'); meta.className = 'meta';
    var src = document.createElement('span'); src.className = 'src';
    if (a.podcast) { var pb = document.createElement('span'); pb.className = 'pod-badge'; pb.title = 'Podcast'; pb.innerHTML = POD_ICON; src.appendChild(pb); }
    src.appendChild(document.createTextNode(a.source));
    var t = document.createElement('time'); t.textContent = a.date ? a.date.slice(11, 16) + ' UTC' : '';
    addChips(meta, a); meta.appendChild(src); meta.appendChild(t);
    var details = document.createElement('button'); details.type = 'button'; details.className = 'card-details';
    details.setAttribute('aria-label', 'Details and export'); details.__article = a;
    meta.appendChild(details);
    var link = document.createElement('a'); link.className = 'title'; link.href = a.link; link.target = '_blank';
    link.rel = 'noopener noreferrer'; link.textContent = a.title;
    el.appendChild(meta); el.appendChild(link);
    var shown = (a.modules || []).filter(function (m) { return m !== 'Other/General' && m !== 'N/A'; });
    if (shown.length) { var mp = document.createElement('div'); mp.className = 'mods'; mp.textContent = shown.join(' · '); el.appendChild(mp); }
    if (a.context) { var p = document.createElement('p'); p.className = 'ctx'; p.textContent = a.context; el.appendChild(p); }
    return el;
  }

  function fillSelect(id, label, counts, sortByCount) {
    var sel = $(id), keys = Object.keys(counts);
    keys.sort(sortByCount ? function (x, y) { return counts[y] - counts[x] || x.localeCompare(y); }
                          : function (x, y) { return x.localeCompare(y); });
    var first = document.createElement('option'); first.value = ''; first.textContent = 'All ' + label;
    sel.appendChild(first);
    keys.forEach(function (k) {
      var o = document.createElement('option'); o.value = k; o.textContent = k + ' (' + counts[k] + ')'; sel.appendChild(o);
    });
  }

  function csvCell(v) {
    v = v == null ? '' : String(v);
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function download(name, mime, content) {
    var url = URL.createObjectURL(new Blob([content], { type: mime }));
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  async function loadTexts() {
    var want = {}, months = {}, texts = {}, failed = [];
    rows.forEach(function (a) { want[a.id] = 1; months[a.date ? a.date.slice(0, 7) : 'undated'] = 1; });
    var list = Object.keys(months);
    for (var i = 0; i < list.length; i++) {
      setStatus('Loading full text ' + (i + 1) + ' of ' + list.length + ' (' + list[i] + ')…');
      try {
        var res = await fetch('fulltext/' + list[i] + '.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var shard = await res.json();
        Object.keys(shard).forEach(function (k) { if (want[k]) texts[k] = shard[k].text || ''; });
      } catch (e) { failed.push(list[i]); }
    }
    return { texts: texts, failed: failed };
  }

  function exportBaseline(fmt) {
    var m = baselineMeta, base = 'baseline_' + m.by + '_last' + m.W + 'd_vs_' + m.N + 'w_' + m.anchor;
    var weekHead = baselineRows.length ? baselineRows[0].weekly.map(function (_, i, a) { return i === a.length - 1 ? 'This week' : 'Week -' + (a.length - 1 - i); }) : [];
    var recs = baselineRows.map(function (r) {
      return { group: r.group, current: r.current, baseline_expected: Math.round(r.expected * 100) / 100,
               change_pct: r.delta === null ? null : Math.round(r.delta * 1000) / 10, z_score: Math.round(r.z * 100) / 100, status: r.status, weekly: r.weekly };
    });
    if (fmt === 'json') {
      download(base + '.json', 'application/json', JSON.stringify({ exported: new Date().toISOString(), as_of: m.anchor, group_by: m.by,
        window: { days: m.W, from: m.from, to: m.anchor }, baseline: { days: m.baseDays, from: m.baseFrom, to: m.baseTo },
        filters: { category: $('category').value, vendor: $('vendor').value, module: $('module').value, source: $('source').value, type: $('type').value, search: $('q').value },
        rows: recs }, null, 2));
    } else {
      var lines = [['Group', 'Last ' + m.W + ' days', 'Baseline (expected)', 'Change %', 'Z score', 'Status'].concat(weekHead).join(',')];
      recs.forEach(function (x) {
        lines.push([x.group, x.current, x.baseline_expected, x.change_pct === null ? 'new' : x.change_pct, x.z_score, x.status].concat(x.weekly).map(csvCell).join(','));
      });
      download(base + '.csv', 'text/csv;charset=utf-8', '﻿' + lines.join('\r\n'));
    }
    setStatus('Exported ' + recs.length + ' baseline rows as ' + fmt.toUpperCase() + '.');
  }

  async function doExport(fmt) {
    if (view === 'baseline') { exportBaseline(fmt); return; }
    var withText = $('fulltext').checked, texts = {}, failed = [];
    $('btn-json').disabled = $('btn-csv').disabled = true;
    try {
      if (withText) { var r = await loadTexts(); texts = r.texts; failed = r.failed; }
      var recs = rows.map(function (a) {
        var rec = { id: a.id, story: a.story || a.id, date: a.date, category: a.category, vendor: a.vendor || '', modules: a.modules || [], podcast: !!a.podcast, source: a.source, title: a.title, link: a.link, context: a.context || '' };
        if (withText) rec.full_text = texts[a.id] || '';
        return rec;
      });
      var rg = range(), cat = $('category').value, vend = $('vendor').value, mod = $('module').value;
      var base = 'articles_' + (cat || 'all-categories') + (vend ? '_' + vend : '') + (mod ? '_' + mod : '') + '_' + (rg.from || 'start') + '_to_' + (rg.to || 'now');
      base = base.replace(/[^A-Za-z0-9_-]+/g, '_');
      if (fmt === 'json') {
        download(base + '.json', 'application/json', JSON.stringify({
          exported: new Date().toISOString(),
          filters: { period: $('period').value, from: rg.from, to: rg.to, category: cat, vendor: vend, module: mod, source: $('source').value, search: $('q').value },
          count: recs.length, articles: recs }, null, 2));
      } else {
        var head = ['ID', 'Story', 'Date', 'Category', 'Vendor', 'Modules', 'Type', 'Source', 'Title', 'Link', 'Context'].concat(withText ? ['Full Text'] : []);
        var lines = [head.join(',')];
        recs.forEach(function (x) {
          var cells = [x.id, x.story, x.date ? x.date.slice(0, 16).replace('T', ' ') + ' UTC' : '', x.category, x.vendor, x.modules.join('; '), x.podcast ? 'Podcast' : 'Article', x.source, x.title, x.link, x.context];
          if (withText) {
            var t = x.full_text;
            cells.push(t.length > CSV_CELL_LIMIT ? t.slice(0, CSV_CELL_LIMIT) + ' [truncated for CSV - use JSON for the full text]' : t);
          }
          lines.push(cells.map(csvCell).join(','));
        });
        download(base + '.csv', 'text/csv;charset=utf-8', '﻿' + lines.join('\r\n'));
      }
      var missing = withText ? recs.filter(function (x) { return !x.full_text; }).length : 0;
      setStatus('Exported ' + recs.length.toLocaleString() + ' articles' +
        (withText ? (missing ? ' (' + missing + ' without saved text)' : ' with full text') : '') +
        (failed.length ? '. Could not load text for: ' + failed.join(', ') : '') + '.', failed.length > 0);
    } catch (e) {
      setStatus('Export failed: ' + e.message, true);
    } finally {
      $('btn-json').disabled = $('btn-csv').disabled = rows.length === 0;
    }
  }

  function init(data) {
    all = data.articles;
    all.forEach(function (a) { var k = a.story || a.id; (byStory[k] = byStory[k] || []).push(a); });
    var cats = {}, vends = {}, srcs = {}, mods = {};
    all.forEach(function (a) {
      cats[a.category] = (cats[a.category] || 0) + 1;
      var vk = a.vendor || NO_VENDOR; vends[vk] = (vends[vk] || 0) + 1;
      srcs[a.source] = (srcs[a.source] || 0) + 1;
      (a.modules || []).forEach(function (m) { mods[m] = (mods[m] || 0) + 1; });
    });
    fillSelect('category', 'categories', cats, true);
    fillSelect('vendor', 'vendors', vends, true);
    fillSelect('module', 'modules', mods, false);
    fillSelect('source', 'sources', srcs, false);
    $('to').max = $('from').max = isoDay(0);
    var timer;
    ['category', 'vendor', 'module', 'type', 'source', 'from', 'to'].forEach(function (id) { $(id).addEventListener('change', applyFilters); });
    $('period').addEventListener('change', function () {
      var custom = $('period').value === 'custom';
      $('from-wrap').hidden = $('to-wrap').hidden = !custom;
      applyFilters();
    });
    $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(applyFilters, 150); });
    $('more').addEventListener('click', renderMore);
    function openArticle(a) {
      window.ArticleModal.open({ id: a.id, shareUrl: location.origin + location.pathname + '#' + a.id,
        title: a.title, link: a.link, source: a.source, date: a.date, category: a.category,
        color: COLORS[a.category] || '', vendor: a.vendor || '', vendorColor: COLORS[a.vendor] || '', modules: a.modules || [], podcast: !!a.podcast, transcript: !!a.transcript,
        context: a.context || '' }, { fullTextBase: 'fulltext/' });
    }
    function openFromHash() {
      var id = location.hash.replace('#', '');
      if (!/^[0-9a-f]{12}$/.test(id)) return;
      var hit = all.filter(function (a) { return a.id === id; })[0];
      if (hit) openArticle(hit); else setStatus('No article with ID ' + id + ' was found.', true);
    }
    $('list').addEventListener('click', function (e) {
      var btn = e.target.closest('.card-details');
      if (btn && btn.__article) { openArticle(btn.__article); return; }
      var open = e.target.closest('.topic-open');
      if (open && open.__topic) {
        var t = open.__topic;
        window.StoryModal.open({ title: t.lead.title, members: t.total.map(toArticle) }, { fullTextBase: 'fulltext/' });
      }
    });
    function setView(next) {
      view = next;
      ['articles', 'topics', 'baseline'].forEach(function (v) { $('view-' + v).setAttribute('aria-pressed', next === v ? 'true' : 'false'); });
      $('topic-options').hidden = next !== 'topics';
      $('baseline-options').hidden = next !== 'baseline';
      $('period').disabled = next === 'baseline';
      applyFilters();
    }
    $('view-articles').addEventListener('click', function () { setView('articles'); });
    $('view-topics').addEventListener('click', function () { setView('topics'); });
    $('view-baseline').addEventListener('click', function () { setView('baseline'); });
    ['bl-by', 'bl-window', 'bl-weeks', 'bl-sort'].forEach(function (id) { $(id).addEventListener('change', applyFilters); });
    // Clicking a group in the baseline table shows its articles for the same window
    function showGroup(group) {
      var by = baselineMeta.by;
      var target = by === 'category' ? 'category' : by === 'vendor' ? 'vendor' : 'module';
      $('category').value = $('vendor').value = $('module').value = '';
      $(target).value = group;
      $('period').disabled = false;
      $('period').value = 'custom'; $('from-wrap').hidden = $('to-wrap').hidden = false;
      $('from').value = baselineMeta.from; $('to').value = '';
      setView('articles');
    }
    $('list').addEventListener('click', function (e) {
      var g = e.target.closest('.bl-group');
      if (g && g.__group) showGroup(g.__group);
    });
    $('topic-sort').addEventListener('change', applyFilters);
    $('topic-multi').addEventListener('change', applyFilters);
    $('btn-json').addEventListener('click', function () { doExport('json'); });
    $('btn-csv').addEventListener('click', function () { doExport('csv'); });
    window.addEventListener('hashchange', openFromHash);
    applyFilters();
    openFromHash();
  }

  fetch('articles.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(init)
    .catch(function (e) {
      $('summary').textContent = 'Could not load articles';
      setStatus('Could not load articles.json (' + e.message + '). Open this page from the published site, not from a file.', true);
    });
})();
</script>
</body>
</html>
